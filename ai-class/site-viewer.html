<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#15233c">
<meta name="robots" content="noindex,nofollow">
<title>사이트 열기 | GIOMAR AI CLASS</title>
<style>
:root{--navy:#15233c;--gold:#b39463;--violet:#7665b1;--line:#e8e7f2;--paper:#f7f8fb}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#25344c;background:var(--paper)}
a{color:inherit;text-decoration:none}
button,a{touch-action:manipulation}
a:focus-visible,button:focus-visible{outline:3px solid #c6a1ec;outline-offset:3px}
.topbar{display:flex;align-items:center;flex-wrap:wrap;justify-content:space-between;gap:10px;padding:11px clamp(12px,2.5vw,26px);background:var(--navy);color:white;box-shadow:0 2px 12px rgba(18,27,52,.16)}
.return{display:flex;align-items:center;gap:9px;background:white;color:#1b2b47;font-size:14px;font-weight:800;padding:12px 16px;border-radius:11px;white-space:nowrap}
.center{min-width:0;flex:1;text-align:center}
.center small{display:block;font-size:10px;letter-spacing:.16em;color:#c6bddc;font-weight:700}
.center strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.external{background:#eee9fd;color:#443475;border-radius:11px;padding:12px 16px;font-size:13px;font-weight:800;white-space:nowrap}
.help{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;padding:9px 14px;font-size:12px;color:#65587f;background:#f4effd;border-bottom:1px solid #e6dff4}
.help span{max-width:920px}
main{position:relative;flex:1;min-height:200px;background:white}
iframe{display:block;border:0;height:100%;width:100%;background:white}
.outbound{padding:clamp(25px,6vw,70px);text-align:center;max-width:700px;margin:8vh auto 0;display:flex;flex-direction:column;align-items:center;gap:15px}.outbound h1{font-size:clamp(22px,3vw,30px);margin:5px 0}.outbound p{color:#65738b;line-height:1.8;margin:0 0 9px}.outbound-icon{width:82px;height:82px;border-radius:22px;background:#efebf9;color:#7054a4;display:grid;place-items:center;font-size:36px}.launch{display:inline-flex;padding:14px 24px;background:#15233c;color:#fff;border-radius:12px;font-weight:800}.return-secondary{color:#574783;padding:12px;font-size:14px}.empty{display:none;align-items:center;justify-content:center;height:100%;padding:25px;text-align:center}
.empty p{line-height:1.8}
@media(max-width:620px){
.topbar{gap:8px;padding:10px}
.return,.external{font-size:12px;padding:10px 11px}
.center{order:3;flex-basis:100%;text-align:left}
.center strong{font-size:13px}
.help{font-size:11px}
}
</style>
</head>
<body>
<header class="topbar">
<a class="return" href="./" aria-label="GIOMAR AI CLASS 자료실로 돌아가기">← 자료실로 돌아가기</a>
<div class="center"><small>GIOMAR AI CLASS · 바로가기</small><strong id="siteName">사이트 연결 중</strong></div>
<a class="external" id="externalLink" href="./" target="_blank" rel="noopener noreferrer">사이트 새 탭에서 열기 ↗</a>
</header>
<div class="help" role="note"><span>ChatGPT, Pinterest 등 외부 사이트는 보안 설정에 따라 화면 안에 삽입할 수 없습니다. <strong>새 탭에서 열기</strong>를 누르면 정상적인 사이트로 이동합니다.</span></div>
<main><section class="outbound" id="outbound"><div class="outbound-icon" aria-hidden="true">↗</div><h1 id="outboundTitle">외부 사이트 열기</h1><p>일부 사이트는 다른 웹페이지 안에서 열리지 않습니다.<br>아래 버튼을 눌러 <strong>새 탭에서 사이트를 열면</strong> 이 화면은 그대로 남아 있습니다.</p><a class="launch" id="launchLink" href="./" target="_blank" rel="noopener noreferrer">사이트 새 탭에서 열기 ↗</a><a class="return-secondary" href="./">← 자료실로 돌아가기</a></section><div class="empty" id="empty"><p>유효하지 않은 주소입니다.<br><a class="return" style="display:inline-flex;margin-top:14px" href="./">← 자료실로 돌아가기</a></p></div></main>
<script>
(function(){
'use strict';
const p=new URLSearchParams(location.search);
const raw=p.get('url')||'';
const name=(p.get('title')||'외부 사이트').slice(0,90);
let valid=false;
try{let u=new URL(raw);valid=(u.protocol==='https:'&&!!u.hostname&&!u.username&&!u.password)}catch{}
if(!valid){document.getElementById('outbound').style.display='none';document.getElementById('empty').style.display='flex';document.getElementById('externalLink').style.display='none';document.getElementById('siteName').textContent='사이트 주소 확인 필요';return}
document.title=name+' | GIOMAR AI CLASS';
document.getElementById('siteName').textContent=name;
document.getElementById('outboundTitle').textContent=name;
document.getElementById('externalLink').href=raw;
document.getElementById('launchLink').href=raw;
})();
</script>
</body>
</html>
