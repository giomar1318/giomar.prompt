:root{color-scheme:light;--bg:#f8f7fa;--paper:#fff;--ink:#262032;--muted:#71697b;--line:#e9e5ed;--plum:#604471;--deep:#282235;--gold:#c1a16e;--soft:#f2ecf6;--green:#157254;--danger:#ab3c43}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;line-height:1.6}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #bda4cf;outline-offset:2px}header{background:linear-gradient(110deg,#29223b 0%,#44314f 65%,#553d50 100%);color:white;padding:34px max(24px,calc((100vw - 1160px)/2)) 30px;position:relative;overflow:hidden}header:after{content:'';position:absolute;width:260px;height:260px;border:1px solid #ffffff1d;border-radius:100%;top:-140px;right:6%;box-shadow:0 0 0 70px #ffffff06;pointer-events:none}.brand{font-weight:750;letter-spacing:.21em;font-size:12px;color:#e7cf9d}header h1{font-size:clamp(26px,3.8vw,39px);line-height:1.3;margin:7px 0}header p{font-size:14px;color:#e8e0ed;max-width:620px;margin:9px 0 0}.wrap{max-width:1160px;margin:0 auto;padding:23px 22px 65px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:15px}.search{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 13px;height:45px;flex:1;min-width:195px;outline:none}.btn{border:1px solid #d7d0df;color:#3d304b;border-radius:10px;padding:10px 14px;background:white;font-size:13px;font-weight:700;min-height:43px}.btn:hover:not(:disabled){border-color:#947a9f;background:#fbf8fd}.btn.primary{background:var(--plum);color:#fff;border-color:var(--plum)}.btn.primary:hover:not(:disabled){background:#513760}.btn.ghost{background:transparent}.btn.danger{color:var(--danger)}.btn.small{min-height:35px;padding:7px 10px}.btn.gold{background:#e9dac0;border-color:#d7bd91;color:#42311e}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.chip{background:white;border:1px solid var(--line);border-radius:50px;padding:9px 13px;color:#675d6c;font-size:13px}.chip[aria-pressed='true']{color:#513365;border-color:#b9a5c5;background:#f0e8f6;font-weight:760}.meta{display:flex;align-items:center;gap:10px;margin:4px 0 16px;font-size:13px;color:var(--muted)}.pill{border:1px solid var(--line);border-radius:25px;background:white;padding:3px 11px;color:#554165;font-weight:750}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{min-width:0;background:white;border:1px solid var(--line);border-radius:15px;padding:19px 20px 16px;box-shadow:0 3px 15px #27203107;display:flex;flex-direction:column}.card.long{grid-column:span 2}.eyebrow{font-size:12px;font-weight:750;color:var(--plum)}.card h2{font-size:18px;line-height:1.42;margin:4px 0 11px;font-weight:750;overflow-wrap:anywhere}.prompt{font-size:var(--prompt-size,16px);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85;margin:0 0 15px;flex:1}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:auto}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:55px 0;border:1px dashed #d8cedb;border-radius:14px}.foot{text-align:center;color:#867f8d;font-size:12px;margin-top:38px}.toast{position:fixed;bottom:20px;right:20px;background:#31283d;color:white;border-radius:11px;box-shadow:0 10px 25px #0003;padding:12px 18px;max-width:min(370px,90vw);z-index:120;opacity:0;pointer-events:none;transition:opacity .16s}.toast.on{opacity:1}.subnote{font-size:13px;color:var(--muted);margin:4px 0 0}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:760px){.cards{grid-template-columns:1fr}.card.long{grid-column:span 1}.wrap{padding:18px 13px 40px}header{padding:27px 18px 22px}.card{padding:17px}.btn{padding:9px 11px}}@media print{header{background:none;color:black;padding:10px}.brand,header p{color:black}.toolbar,.filters,.actions,.foot,.toast,.manager-only{display:none!important}.wrap{padding:0}.cards{display:block}.card{break-inside:avoid;margin-bottom:12px;box-shadow:none}.prompt{font-size:13px!important}}

<header><div class="brand">GIOMAR · AI CREATIVE CLASS</div><h1>프롬프트 수업실</h1><p>도순동 AI 아트 2회차 · 프롬프트를 선택하고 복사하여 실습해 보세요.</p></header>
<main class="wrap"><div class="toolbar"><input class="search" type="search" id="search" placeholder="제목·내용 검색" aria-label="프롬프트 검색"><button id="smaller" class="btn" aria-label="글자 작게">가−</button><button id="bigger" class="btn" aria-label="글자 크게">가＋</button></div><nav class="filters" id="filters" aria-label="프롬프트 분류"></nav><div class="meta"><span class="pill" id="count"></span><span>각 항목의 복사 버튼을 눌러 사용하세요.</span></div><section class="cards" id="cards"></section><p class="foot">GIOMAR by SEOGYEONG · AI는 도구, 감성은 메시지<br>강의용 프롬프트 · 출처 표기: @giomar_art</p></main><div id="toast" class="toast" role="status"></div>
<script>
const ITEMS=[{"id":1,"group":"2회차 기본 실습","category":"예술·스타일","title":"제주 설화에서 영감을 받은 수채화","text":"산방산이 보이는 상상 속 동굴 입구, 바다를 바라보는 가상의 성인 여성과 빛나는 물방울을 그려줘. 따뜻하고 신비로운 수채화 그림책 스타일, 가로 16:9, 글자 없이. 실제 설화의 특정 장면을 그대로 재현한 것이 아니라 창작 해석이야.","source":"도순동 2회차 강의안"},{"id":2,"group":"2회차 기본 실습","category":"예술·스타일","title":"유화 스타일로 변경","text":"방금 만든 이미지의 주제와 주요 구도는 가능한 한 유지하고, 두꺼운 붓터치와 풍부한 물감 질감이 보이는 인상주의 유화 스타일로 바꿔줘. 글자는 넣지 마.","source":"도순동 2회차 강의안"},{"id":3,"group":"2회차 기본 실습","category":"예술·스타일","title":"한국 민화 스타일로 변경","text":"방금 만든 이미지의 주요 소재를 유지하면서 한국 민화에서 영감을 받은 새로운 그림으로 바꿔줘. 평면적인 구성, 선명하고 조화로운 색채, 장식적인 구름과 꽃을 활용해줘. 원작 복제는 피하고 글자는 제외해줘.","source":"도순동 2회차 강의안"},{"id":4,"group":"2회차 기본 실습","category":"생활 디자인","title":"감성 패턴지","text":"귀여운 작은 꽃과 나뭇잎, 노란 리본이 반복되는 감성 패턴지를 만들어줘. 아이보리 배경, 라벤더와 노란색 포인트, 깔끔한 일러스트 스타일. 반복해서 이어 붙여도 자연스러운 심리스 패턴. 정사각형, 글자 없이.","source":"도순동 2회차 강의안"},{"id":5,"group":"2회차 기본 실습","category":"생활 디자인","title":"제주돌문화공원 가상 행사 포스터","text":"제주돌문화공원에서 열리는 가상의 문화 행사를 홍보할 A4 세로형 포스터를 만들어줘. 제주 돌문화와 현무암의 분위기가 느껴지는 장면을 중심으로 디자인하고, 제목·날짜·장소가 들어갈 공간을 보기 좋게 배치해줘. 실제 행사로 오해되지 않도록 내용은 가상 예시로 구성해줘.","source":"도순동 2회차 강의안"},{"id":6,"group":"2회차 기본 실습","category":"생활 디자인","title":"AI 그림 수업 홍보 포스터","text":"성인을 위한 즐거운 AI 그림 수업을 홍보하는 세로형 포스터를 만들어줘. 노트북에서 꽃과 별, 귀여운 캐릭터가 튀어나오는 장면을 밝고 세련된 3D 일러스트로 표현해줘. 제목, 수업 일정과 안내 문구를 읽기 쉽고 깔끔하게 배치해줘. 실제 날짜와 장소가 정해지지 않았으므로 임의의 실제 기관명이나 연락처는 넣지 마.","source":"도순동 2회차 강의안"},{"id":7,"group":"2회차 기본 실습","category":"자유 창작","title":"명화 감성 재해석","text":"고전 인상주의 회화에서 영감을 받아, 별빛이 쏟아지는 밤하늘 아래 작은 기차역을 그려줘. 두꺼운 붓터치와 강렬한 색채를 활용하되 기존 작품의 구도를 그대로 복제하지 않고 새로운 장면으로 창작해줘. 가로 16:9, 글자 없이.","source":"도순동 2회차 강의안"},{"id":8,"group":"2회차 기본 실습","category":"자유 창작","title":"한복 패션 룩북","text":"실존 인물을 참고하지 않은 가상의 성인 패션모델이 현대적으로 재해석한 한복 패션을 입고 있어. 네이비와 라벤더 색상의 세련된 의상, 은은한 자수와 고급스러운 소재, 자연스러운 전신 포즈, 패션 잡지 룩북 사진 스타일. 세로 3:4, 글자 없이.","source":"도순동 2회차 강의안"},{"id":9,"group":"2회차 기본 실습","category":"자유 창작","title":"3컷 인스타툰","text":"귀여운 가상의 직장인 캐릭터가 월요일 출근길에 커피를 쏟을 뻔하는 웃긴 상황을 인스타툰 3컷으로 그려줘. 1컷 자신만만한 출근, 2컷 커피가 흔들리는 순간, 3컷 겨우 지킨 안도하는 표정. 캐릭터와 옷은 일관되게, 깔끔한 손그림 만화 스타일, 세로 4:5. 글자 없이.","source":"도순동 2회차 강의안"},{"id":10,"group":"2회차 기본 실습","category":"자유 창작","title":"별씨앗 그림동화 한 장면","text":"작은 소녀가 밤하늘 아래 꽃이 피지 않는 정원에 반짝이는 별씨앗을 심고 있어. 소녀가 두 손으로 흙을 덮자 땅에서 작은 별빛 꽃 한 송이가 피어나는 순간을 그려줘. 소녀의 얼굴에는 놀라움과 기쁨이 가득하고, 정원에는 희망의 빛이 퍼져 나가. 환상적인 어린이 그림동화 스타일, 라벤더와 은은한 황금빛, 3D 픽사 스타일. 가로 16:9, 글자 없이.","source":"도순동 2회차 강의안"},{"id":11,"group":"2회차 기본 실습","category":"영상 맛보기","title":"ChatGPT에서 5초 영상 프롬프트 만들기","text":"첨부한 이미지를 5초짜리 짧은 AI 영상으로 만들고 싶어.\n주인공·배경·색감·스타일은 최대한 유지해 줘.\n이미지에 어울리는 움직임 1~2개와 쉬운 카메라 연출 1개를 추천해 줘.\n영상 생성 도구에 바로 붙여 넣을 수 있도록 간단한 프롬프트를 한 문단으로 써 줘.","source":"도순동 2회차 강의안"},{"id":12,"group":"2회차 기본 실습","category":"영상 맛보기","title":"이미지 기반 영상 생성 도구용 예시","text":"업로드한 꽃 이미지의 색감과 배경을 유지해 줘. 꽃잎이 바람에 살랑살랑 흔들리고, 카메라는 꽃을 향해 천천히 다가간다. 따뜻하고 평화로운 분위기.","source":"도순동 2회차 강의안"},{"id":13,"group":"특별 창작","category":"AI 자아탐색","title":"AI가 발견한 나의 창작 컬러는?","text":"AI가 발견한 나의 창작 컬러는?\n\n지금까지 나와 실제로 나눈 대화를 바탕으로 나의 성향과 창작 세계를 분석하고, 그것을 색으로 표현한 한 장의 AI 아트 작품을 만들어 주세요.\n\n단순히 내가 좋아한다고 말한 색을 고르거나 일반적인 색채심리 공식에 맞추지 마세요.\n내 말투, 관심사, 선택하는 방식, 중요하게 생각하는 가치, 반복적으로 나타나는 취향과 분위기 등을 종합적으로 살펴봐 주세요.\n대화에서 확인되지 않는 성향은 임의로 만들어내지 마세요.\n\n1. 먼저 나를 분석해 주세요\n대화에서 반복적으로 나타나는 감성 DNA 4가지를 내부적으로 찾아주세요.\n그 특징을 바탕으로 나를 표현하는 색을 선정합니다.\nMAIN COLOR 1개: 나의 가장 중심적인 성향\nSUPPORTING COLOR 2개: 나의 서로 다른 모습\nSIGNATURE COLOR 1개: 나만의 개성과 가능성을 보여주는 색\n평범한 색 이름 대신 나의 이야기가 느껴지는 감성적인 색 이름을 만들어 주세요.\n예를 들어 ‘보라색’, ‘파란색’처럼 단순하게 이름 붙이지 말고, 분석 결과에 맞춰 새로운 이름을 만들어 주세요.\n\n2. 작품으로 표현해 주세요\nVISUAL STYLE: Emotional Abstract Color Portrait\n나를 사람이나 캐릭터로 그리지 마세요.\n나라는 사람을 색·빛·질감·형태로 표현한 추상 자화상으로 만들어 주세요.\n화면 전체가 갤러리에 전시된 한 점의 현대 추상회화처럼 보이게 합니다.\n반투명하게 겹쳐지는 색, 깊이 있는 안료의 질감, 부드러운 빛, 서로 스며들고 번지는 색의 경계, 섬세한 흔적과 여백을 활용해 주세요.\nMAIN COLOR가 작품 전체의 중심 정서를 만들고, 다른 색들이 자연스럽게 만나고 겹쳐지도록 표현합니다.\n색을 네 칸으로 나누거나 팔레트 표처럼 보여주지 마세요.\n다꾸·메모지·캐릭터·컬러칩·정보 카드·인포그래픽·여러 개의 설명 박스는 사용하지 않습니다.\n\n3. 이미지 속 글자는 최소화해 주세요\n이미지에는 다음만 넣습니다.\n나의 창작 컬러는?\n[AI가 발견한 MAIN COLOR의 감성 이름]\n작게: “나를 색으로 번역하다.”\n그 외 설명문은 이미지에 넣지 않습니다.\n한글은 정확하게 표현하고, 깨진 글자나 의미 없는 문자를 만들지 마세요.\n\n4. 가장 중요한 원칙\n분석은 깊게, 작품은 심플하게.\n내가 어떤 사람인지 글로 많이 설명하지 마세요.\n대신 색 자체가 나를 이야기하도록 만들어 주세요.\n결과물을 보았을 때 단순히 “내가 좋아하는 색이네.”가 아니라 “AI가 나라는 사람을 색으로 표현하면 이런 느낌이구나.”라는 감정이 들게 해주세요.\n분석을 마쳤다면 추가 질문 없이 바로 작품을 제작해 주세요.","source":"AI가 발견한 나의 창작 컬러는?"},{"id":14,"group":"특별 창작","category":"GIOMAR 나전칠기","title":"GIOMAR LUMINOUS NACRE · SPLENDOR 최종 1개","text":"[주제]를 화려하고 품격 있는 GIOMAR 현대 나전칠기 예술 작품으로 재해석해 주세요. 깊고 윤택한 검은 옻칠 위에 실제 장인이 손으로 자르고 이어 붙인 듯한 크고 작은 자개 패각과 가느다란 자개 선으로 [주제]의 온전한 형태를 표현합니다.\n자개는 진주빛·청록·공작석 블루·사파이어 블루·남보라·은빛·미세한 자홍빛이 빛의 각도에 따라 변화하는 천연 패각의 풍부한 간섭광을 보여줍니다. 가느다란 금빛 세공선을 포인트로 사용합니다.\n[주제]와 어울리는 한국적 자연·문화 요소 2~3개를 선택하여 전경·중경·후경에 풍성하게 구성하고, 흑칠의 깊은 어둠과 영롱한 자개의 강한 대비를 만듭니다.\n화려하지만 고급스럽게, 풍성하지만 중심이 분명하게, 실제 한국 나전칠기의 수공예 물성이 느껴지는 박물관급 현대 예술 작품.\nOpulent contemporary Korean nacre art, authentic mother-of-pearl inlay craftsmanship, deep glossy black lacquer, richly layered irregular hand-cut shell fragments, pearl, turquoise, peacock blue, sapphire, deep violet and silver natural iridescence, fine gold inlay accents, sophisticated Korean ornamental composition, luxurious handcrafted materiality, museum-quality artwork, highly detailed.\n피하기: 디지털 모자이크, 글리터, 홀로그램, 네온, 크리스털, 플라스틱, 과도한 노란 금색, 동일한 패각 반복, 깨짐·폭발·큰 파편, 값싼 장식 효과.\n글자·로고·워터마크 없음. 4:5 세로, 고해상도.","source":"GIOMAR LUMINOUS NACRE 가이드 최종"},{"id":15,"group":"워크북 이미지","category":"이미지","title":"감성 꽃 포스터 · 이미지 프롬프트","text":"아이보리색 수제 종이 배경 위에 구성된 감성 아트 포스터. 화면 한쪽에는 섬세한 흑백 연필 선화 스타일의 소녀를 배치하고, 옆에는 해바라기 또는 수국 한 송이를 실제 꽃처럼 사실적으로 크게 표현한다. 하단에는 작은 메모 종이와 베이지색 마스킹테이프를 넣고, 주변에는 작은 하트와 점 장식을 아주 절제되게 더한다. 전체 분위기는 따뜻하고 조용하며 감성적인 느낌. 상단에는 짧은 문구를 넣을 수 있는 빈 여백을 남긴다. 실사 꽃 + 흑백 선화 + 종이 콜라주 스타일, 4:5 세로 비율, 4K, 8K detail, soft natural light, no logo, no watermark","source":"GIOMAR AI 아트 프롬프트 워크북 1부"},{"id":16,"group":"워크북 이미지","category":"이미지","title":"제주 바다 풍경 · 이미지 프롬프트","text":"제주의 맑고 푸른 바다가 보이는 풍경. 에메랄드빛 바다와 하얀 포말, 맑은 하늘, 햇살이 비치는 제주 해안의 평화로운 장면. 화면 앞쪽에는 유채꽃 또는 풀꽃이 자연스럽게 배치되고, 전체 분위기는 따뜻하고 청량하며 감성적인 느낌으로 표현한다. 동화책 일러스트 스타일, 부드러운 자연광, 파스텔 톤, 섬세한 붓터치, 4:5 세로 비율, 4K, 8K detail, no text, no logo, no watermark","source":"GIOMAR AI 아트 프롬프트 워크북 1부"},{"id":17,"group":"워크북 이미지","category":"이미지","title":"카페에서 책 읽는 여성 · 이미지 프롬프트","text":"햇살이 비치는 조용한 카페 창가에 앉아 책을 읽는 20대 한국 여성. 테이블 위에는 커피 한 잔과 작은 꽃병이 놓여 있고, 창문으로 따뜻한 빛이 들어온다. 여성은 편안하고 차분한 표정이며, 전체 분위기는 잔잔하고 감성적이다. 부드러운 파스텔 색감의 동화책 일러스트 스타일, 아늑한 실내 분위기, 4:5 세로 비율, 4K, 8K detail, no text, no watermark","source":"GIOMAR AI 아트 프롬프트 워크북 1부"}];

let selected='전체',sz=16,toastTimer;
function notice(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('on'),2300)}
async function copyText(t){try{if(!navigator.clipboard?.writeText)throw Error();await navigator.clipboard.writeText(t);notice('프롬프트를 복사했어요.');}catch(_){let temp=document.createElement('textarea');temp.value=t;temp.style.cssText='position:fixed;top:-2000px;left:-2000px';document.body.append(temp);temp.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}temp.remove();notice(ok?'프롬프트를 복사했어요.':'복사가 제한되었어요. 내용을 선택해 복사해 주세요.')}}
function render(){const categories=['전체',...new Set(ITEMS.map(p=>p.group))];const q=$('#search').value.trim().toLocaleLowerCase();let show=ITEMS.filter(p=>(selected==='전체'||p.group===selected)&&[p.title,p.text,p.category].join(' ').toLocaleLowerCase().includes(q));$('#filters').innerHTML=categories.map(g=>`<button class="chip" data-group="${escapeHtml(g)}" aria-pressed="${String(g===selected)}">${escapeHtml(g)} · ${g==='전체'?ITEMS.length:ITEMS.filter(p=>p.group===g).length}</button>`).join('');$('#count').textContent=show.length+'개 프롬프트';$('#cards').innerHTML=show.length?show.map(p=>`<article class="card ${p.text.length>820?'long':''}"><div class="eyebrow">${escapeHtml(p.group)} · ${escapeHtml(p.category)}</div><h2>${escapeHtml(p.title)}</h2><p class="prompt">${escapeHtml(p.text)}</p><div class="actions"><button class="btn primary" data-copy="${p.id}">프롬프트 복사</button></div></article>`).join(''):'<div class="empty">검색 결과가 없습니다. 다른 검색어를 입력해 보세요.</div>'}
$('#filters').addEventListener('click',e=>{const b=e.target.closest('button[data-group]');if(b){selected=b.dataset.group;render()}});
$('#cards').addEventListener('click',e=>{const b=e.target.closest('button[data-copy]');if(b){const p=ITEMS.find(x=>String(x.id)===b.dataset.copy);if(p)copyText(p.text)}});
$('#search').addEventListener('input',render);
$('#bigger').addEventListener('click',()=>{sz=Math.min(27,sz+2);document.documentElement.style.setProperty('--prompt-size',sz+'px')});
$('#smaller').addEventListener('click',()=>{sz=Math.max(12,sz-2);document.documentElement.style.setProperty('--prompt-size',sz+'px')});
render();
</script></body></html>
