<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#29223b"><title>GIOMAR | 1회차 프롬프트 수업실</title><style>
:root{color-scheme:light;--bg:#f8f7fa;--paper:#fff;--ink:#262032;--muted:#71697b;--line:#e9e5ed;--plum:#604471;--deep:#282235;--gold:#c1a16e;--soft:#f2ecf6;--green:#157254;--danger:#ab3c43}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;line-height:1.6}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #bda4cf;outline-offset:2px}header{background:linear-gradient(110deg,#29223b 0%,#44314f 65%,#553d50 100%);color:white;padding:34px max(24px,calc((100vw - 1160px)/2)) 30px;position:relative;overflow:hidden}header:after{content:'';position:absolute;width:260px;height:260px;border:1px solid #ffffff1d;border-radius:100%;top:-140px;right:6%;box-shadow:0 0 0 70px #ffffff06;pointer-events:none}.brand{font-weight:750;letter-spacing:.21em;font-size:12px;color:#e7cf9d}header h1{font-size:clamp(26px,3.8vw,39px);line-height:1.3;margin:7px 0}header p{font-size:14px;color:#e8e0ed;max-width:620px;margin:9px 0 0}.wrap{max-width:1160px;margin:0 auto;padding:23px 22px 65px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:15px}.search{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 13px;height:45px;flex:1;min-width:195px;outline:none}.btn{border:1px solid #d7d0df;color:#3d304b;border-radius:10px;padding:10px 14px;background:white;font-size:13px;font-weight:700;min-height:43px}.btn:hover:not(:disabled){border-color:#947a9f;background:#fbf8fd}.btn.primary{background:var(--plum);color:#fff;border-color:var(--plum)}.btn.primary:hover:not(:disabled){background:#513760}.btn.ghost{background:transparent}.btn.danger{color:var(--danger)}.btn.small{min-height:35px;padding:7px 10px}.btn.gold{background:#e9dac0;border-color:#d7bd91;color:#42311e}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.chip{background:white;border:1px solid var(--line);border-radius:50px;padding:9px 13px;color:#675d6c;font-size:13px}.chip[aria-pressed='true']{color:#513365;border-color:#b9a5c5;background:#f0e8f6;font-weight:760}.meta{display:flex;align-items:center;gap:10px;margin:4px 0 16px;font-size:13px;color:var(--muted)}.pill{border:1px solid var(--line);border-radius:25px;background:white;padding:3px 11px;color:#554165;font-weight:750}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{min-width:0;background:white;border:1px solid var(--line);border-radius:15px;padding:19px 20px 16px;box-shadow:0 3px 15px #27203107;display:flex;flex-direction:column}.card.long{grid-column:span 2}.eyebrow{font-size:12px;font-weight:750;color:var(--plum)}.card h2{font-size:18px;line-height:1.42;margin:4px 0 11px;font-weight:750;overflow-wrap:anywhere}.prompt{font-size:var(--prompt-size,16px);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85;margin:0 0 15px;flex:1}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:auto}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:55px 0;border:1px dashed #d8cedb;border-radius:14px}.foot{text-align:center;color:#867f8d;font-size:12px;margin-top:38px}.toast{position:fixed;bottom:20px;right:20px;background:#31283d;color:white;border-radius:11px;box-shadow:0 10px 25px #0003;padding:12px 18px;max-width:min(370px,90vw);z-index:120;opacity:0;pointer-events:none;transition:opacity .16s}.toast.on{opacity:1}.subnote{font-size:13px;color:var(--muted);margin:4px 0 0}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:760px){.cards{grid-template-columns:1fr}.card.long{grid-column:span 1}.wrap{padding:18px 13px 40px}header{padding:27px 18px 22px}.card{padding:17px}.btn{padding:9px 11px}}@media print{header{background:none;color:black;padding:10px}.brand,header p{color:black}.toolbar,.filters,.actions,.foot,.toast,.manager-only{display:none!important}.wrap{padding:0}.cards{display:block}.card{break-inside:avoid;margin-bottom:12px;box-shadow:none}.prompt{font-size:13px!important}}
.seq{display:inline-block;color:#826789;font-size:.73em;letter-spacing:.05em;vertical-align:middle;margin-right:5px}.prompt{white-space:pre-wrap}</style></head><body>
<header><div class="brand">GIOMAR · AI CREATIVE CLASS</div><h1>프롬프트 수업실</h1><p>AI 한 컷, 한 편 · 1회차 · 필요한 프롬프트를 선택하고 복사해 보세요.</p></header>
<main class="wrap"><div class="toolbar"><input class="search" type="search" id="search" placeholder="제목·내용 검색" aria-label="프롬프트 검색"><button id="smaller" class="btn" aria-label="글자 작게">가−</button><button id="bigger" class="btn" aria-label="글자 크게">가＋</button></div><nav class="filters" id="filters" aria-label="프롬프트 분류"></nav><div class="meta"><span class="pill" id="count"></span><span>각 항목의 복사 버튼을 눌러 사용하세요.</span></div><section class="cards" id="cards"></section><p class="foot">GIOMAR by SEOGYEONG · AI는 도구, 감성은 메시지<br>강의용 프롬프트 · 출처 표기: @giomar_art</p></main><div id="toast" class="toast" role="status"></div>
<script>
const ITEMS=[{"id":1,"group":"공통 연습","category":"01 · 실습","title":"한 문장으로 시작","text":"이미지를 만들어줘. 제주 돌담 옆에서 귤 하나를 들고 있는 귀여운 토끼. 따뜻한 오후 햇빛과 부드러운 수채화 느낌. 토끼 전신이 보이는 정사각형 구도. 글자는 넣지 마.","source":"GIOMAR 1회차 강의안 프롬프트 (첨부 PDF)"},{"id":2,"group":"첫 이미지 만들기","category":"02 · 실습","title":"귤 모자를 쓴 말티즈","text":"이미지를 만들어줘. 귤 모자를 쓴 작고 귀여운 말티즈가 제주 돌담 옆에서 정면을 바라보고 있어. 하얀 털, 동그란 검은 눈과 자연스러운 네 발 자세. 손으로 빚은 점토 인형 느낌, 아이보리와 귤색, 부드러운 햇빛. 전신이 보이는 정사각형 구도. 글자는 넣지 마.","source":"GIOMAR 1회차 강의안 프롬프트 (첨부 PDF)"},{"id":3,"group":"첫 이미지 만들기","category":"03 · 실습","title":"바다를 담은 찻잔","text":"이미지를 만들어줘. 창가의 펄 아이보리 찻잔 안에 작은 제주 바다와 꽃 한 송이가 들어 있는 상상 속 장면. 잔 밖에는 라벤더 꽃잎이 몇 장 놓여 있어. 샴페인 골드와 연한 라벤더, 부드러운 아침빛. 섬세한 파인아트 사진 느낌, 정사각형 구도. 글자와 로고는 넣지 마.","source":"GIOMAR 1회차 강의안 프롬프트 (첨부 PDF)"},{"id":4,"group":"첫 이미지 만들기","category":"04 · 실습","title":"설문대할망 창작 장면","text":"제주 설문대할망에서 영감을 받은 창작 이미지를 만들어줘. 거대한 할망의 뒷모습이 낮은 오름 너머로 보이고, 바람에 옷자락이 천천히 펼쳐져 있어. 짙은 남색과 은은한 금빛, 새벽 안개와 현무암. 웅장하지만 무섭지 않은 회화적 판타지 느낌. 풍경이 넓게 보이는 가로 구도. 글자는 넣지 마. 이 장면은 실제 설화의 특정 대목을 재현하는 것이 아니라 새로 상상한 장면이야.","source":"GIOMAR 1회차 강의안 프롬프트 (첨부 PDF)"},{"id":5,"group":"첫 이미지 만들기","category":"05 · 실습","title":"달빛 우체부 여우","text":"이미지를 만들어줘. 작은 여우 우체부가 달빛이 드는 숲속에서 반딧불에게 편지를 건네고 있어. 여우는 작은 우편 가방을 메고, 편지는 한 장만 보여줘. 부드러운 그림책 수채화, 연한 청록과 따뜻한 노란빛. 다정하고 신비로운 분위기, 주인공과 숲이 함께 보이는 정사각형 구도. 이미지에 글자는 넣지 마.","source":"GIOMAR 1회차 강의안 프롬프트 (첨부 PDF)"},{"id":6,"group":"첫 이미지 만들기","category":"06 · 실습","title":"꽃을 든 가상의 한복 인물","text":"이미지를 만들어줘. 펄 아이보리 저고리와 연한 라벤더 치마의 한복을 입은 가상의 성인 여성이 작은 꽃 한 송이를 두 손으로 들고 있어. 옷감의 부드러운 결, 절제된 금빛 자수와 자연스러운 인체 비율. 단정한 정원 배경, 은은한 자연광, 우아한 패션 사진 느낌. 손과 전신이 보이는 세로 구도. 글자와 로고는 넣지 마. 현대 창작 한복 디자인으로 표현해줘.","source":"GIOMAR 1회차 강의안 프롬프트 (첨부 PDF)"},{"id":7,"group":"스타일 바꾸기","category":"07 · 실습","title":"수채화로 바꾸기","text":"방금 만든 이미지의 주인공, 행동과 배치는 가능한 한 유지하고, 표현만 부드러운 그림책 수채화로 바꿔줘. 종이 질감과 은은하게 번지는 색을 보여줘. 글자는 넣지 마.","source":"GIOMAR 1회차 강의안 프롬프트 (첨부 PDF)"},{"id":8,"group":"스타일 바꾸기","category":"08 · 실습","title":"점토 인형으로 바꾸기","text":"방금 만든 이미지의 주인공, 행동과 배치는 가능한 한 유지하고, 표현만 손으로 빚은 점토 인형과 미니어처 세트 느낌으로 바꿔줘. 입체적인 질감과 부드러운 그림자를 보여줘. 글자는 넣지 마.","source":"GIOMAR 1회차 강의안 프롬프트 (첨부 PDF)"},{"id":9,"group":"스타일 바꾸기","category":"09 · 실습","title":"영화풍으로 바꾸기","text":"방금 만든 이미지의 주인공, 행동과 배치는 가능한 한 유지하고, 표현만 영화의 한 장면 같은 사진 느낌으로 바꿔줘. 자연스러운 재질과 부드러운 빛, 배경은 살짝 흐리게 표현해줘. 글자는 넣지 마.","source":"GIOMAR 1회차 강의안 프롬프트 (첨부 PDF)"},{"id":10,"group":"수정·아이디어","category":"10 · 실습","title":"내 주제 빈칸 프롬프트","text":"이미지를 만들어줘. [누가 또는 무엇이] [어디에서] [무엇을 하고 있는지]. [그림 스타일], [주요 색 두 가지], [시간과 빛]. [전신 또는 가까이 또는 넓은 풍경]이 보이는 [정사각형 또는 세로 또는 가로] 구도. 이미지에 글자와 로고는 넣지 마.","source":"GIOMAR 1회차 강의안 프롬프트 (첨부 PDF)"},{"id":11,"group":"수정·아이디어","category":"11 · 실습","title":"구체적으로 수정하기","text":"방금 만든 이미지에서 [바꾸고 싶은 부분]을 [원하는 모습]으로 바꿔줘. [유지하고 싶은 요소]는 가능한 한 유지해줘. 글자는 넣지 마.","source":"GIOMAR 1회차 강의안 프롬프트 (첨부 PDF)"},{"id":12,"group":"수정·아이디어","category":"12 · 실습","title":"아이디어가 막힐 때","text":"나는 [귀여운 캐릭터 / 예쁜 감성 이미지 / 제주 설화에서 영감을 받은 창작 / 새로운 동화 / 한복] 이미지를 만들고 싶어. 처음 배우는 사람도 만들 수 있는 아이디어를 3개 제안해줘. 각각 대상, 장소와 행동을 한 문장으로 정리해줘. 실제 인물이나 기존 캐릭터를 쓰지 마.","source":"GIOMAR 1회차 강의안 프롬프트 (첨부 PDF)"},{"id":13,"group":"수정·아이디어","category":"13 · 실습","title":"빛과 배치 도전","text":"방금 만든 이미지의 주인공을 화면 오른쪽에 배치하고 왼쪽에는 빈 공간을 남겨줘. 빛은 왼쪽 위에서 부드럽게 들어오게 해줘. 주인공의 특징과 주요 색은 가능한 한 유지해줘. 글자는 넣지 마.","source":"GIOMAR 1회차 강의안 프롬프트 (첨부 PDF)"},{"id":14,"group":"이야기·영상 확장","category":"14 · 실습","title":"다음 수업 연결: 짧은 사건","text":"이 이미지 속 주인공에게 작은 사건이 생기는 짧은 이야기 아이디어를 3개 제안해줘. 인물은 2명 이내, 장소는 1곳, 시작과 사건과 반전이 드러나게 해줘. 각 아이디어는 3문장 이내로 써줘. 따뜻한 이야기나 재미있는 반전 중 하나를 선택할 수 있게 해줘.","source":"GIOMAR 1회차 강의안 프롬프트 (첨부 PDF)"},{"id":15,"group":"이야기·영상 확장","category":"15 · 영상","title":"보너스: 10초 모션그래픽 영상","text":"업로드한 이미지를 활용해 10초짜리 16:9 모션그래픽 홍보영상을 만들어줘.\n제주 바다의 윤슬이 반짝이고, 귤나무와 꽃이 부드럽게 흔들리며 귀여운 말티즈가 귤을 들어 올려 인사해.\n따뜻한 햇살, 부드러운 카메라 움직임, 입체적인 2.5D 모션그래픽, 밝고 사랑스러운 그림책 애니메이션 스타일로 연출해줘.\n마지막에는 금빛 빛줄기와 함께 다음 문구가 세련되게 등장해.\n“AI 한 컷, 한 편”\n“상상이 움직이는 순간”\n밝고 경쾌한 배경음악을 넣고, 원본 캐릭터와 그림체를 유지해줘.\n한글 자막은 정확하게 표현해줘.","source":"GIOMAR 1회차 강의안 프롬프트 (첨부 PDF)"}];
const $=q=>document.querySelector(q);
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let selected='전체',sz=16,toastTimer;
function notice(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('on'),2300)}
async function copyText(t){try{if(!navigator.clipboard?.writeText)throw Error();await navigator.clipboard.writeText(t);notice('프롬프트를 복사했어요.');}catch(_){let temp=document.createElement('textarea');temp.value=t;temp.style.cssText='position:fixed;top:-2000px;left:-2000px';document.body.append(temp);temp.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}temp.remove();notice(ok?'프롬프트를 복사했어요.':'복사가 제한되었어요. 내용을 선택해 복사해 주세요.')}}
function render(){const categories=['전체',...new Set(ITEMS.map(p=>p.group))];const q=$('#search').value.trim().toLocaleLowerCase();let show=ITEMS.filter(p=>(selected==='전체'||p.group===selected)&&[p.title,p.text,p.category].join(' ').toLocaleLowerCase().includes(q));$('#filters').innerHTML=categories.map(g=>`<button class="chip" data-group="${escapeHtml(g)}" aria-pressed="${String(g===selected)}">${escapeHtml(g)} · ${g==='전체'?ITEMS.length:ITEMS.filter(p=>p.group===g).length}</button>`).join('');$('#count').textContent=show.length+'개 프롬프트';$('#cards').innerHTML=show.length?show.map(p=>`<article class="card ${p.text.length>820?'long':''}"><div class="eyebrow">${escapeHtml(p.group)} · ${escapeHtml(p.category)}</div><h2><span class="seq">${String(p.id).padStart(2,"0")}</span> ${escapeHtml(p.title)}</h2><p class="prompt">${escapeHtml(p.text)}</p><div class="actions"><button class="btn primary" data-copy="${p.id}">프롬프트 복사</button></div></article>`).join(''):'<div class="empty">검색 결과가 없습니다. 다른 검색어를 입력해 보세요.</div>'}
$('#filters').addEventListener('click',e=>{const b=e.target.closest('button[data-group]');if(b){selected=b.dataset.group;render()}});
$('#cards').addEventListener('click',e=>{const b=e.target.closest('button[data-copy]');if(b){const p=ITEMS.find(x=>String(x.id)===b.dataset.copy);if(p)copyText(p.text)}});
$('#search').addEventListener('input',render);
$('#bigger').addEventListener('click',()=>{sz=Math.min(27,sz+2);document.documentElement.style.setProperty('--prompt-size',sz+'px')});
$('#smaller').addEventListener('click',()=>{sz=Math.max(12,sz-2);document.documentElement.style.setProperty('--prompt-size',sz+'px')});
render();
</script></body></html>
